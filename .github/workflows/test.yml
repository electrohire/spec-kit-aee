name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: Validate manifest
        run: |
          python - <<'PY'
          import pathlib, yaml
          data = yaml.safe_load(pathlib.Path('extension.yml').read_text())
          assert data['schema_version'] == '1.0'
          assert data['extension']['id'] == 'aee'
          assert data['extension']['version'] == '1.0.0'
          assert len(data['provides']['commands']) == 6
          for command in data['provides']['commands']:
              assert pathlib.Path(command['file']).is_file(), command['file']
          PY
      - run: ruff check scripts tests
      - run: pytest -q
      - run: python scripts/python/run_aee.py --help
