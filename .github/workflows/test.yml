name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      # Same targets as applied-epistemic-engineering and
      # spec-kit-evaluator; every step below runs on every target.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      - run: ruff check scripts tests
      - run: pytest -q
      - run: python scripts/python/run_aee.py --help
      # RELEASE CANDIDATE: same commit as run_aee.py EVALUATOR_ARCHIVE_URL
      # (electrohire/spec-kit-evaluator#7); move both to v1.1.1 on release.
      - name: Check out pinned Evaluator dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: electrohire/spec-kit-evaluator
          ref: 578cc11a6f674696629e2dcd04aef421f0aeb978 # v1.1.1 release candidate
          path: artifacts/evaluator
          persist-credentials: false
      - run: python scripts/check_install.py --evaluator-dir artifacts/evaluator

  # Sandbox acceptance: a fresh runner with Spec Kit alone. specify installs
  # AEE from this commit's immutable GitHub archive, and the first AEE
  # operation, run on a package-free Python, must install the engine,
  # jsonschema, and the evaluator extension by itself.
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Spec Kit alone into a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/specify-env"
          bin="$RUNNER_TEMP/specify-env/bin"
          [ -d "$bin" ] || bin="$RUNNER_TEMP/specify-env/Scripts"
          "$bin/python" -m pip install --require-hashes -r requirements/acceptance.txt
          echo "$bin" >> "$GITHUB_PATH"
      - name: Confirm no AEE dependency is preinstalled
        shell: bash
        run: |
          python -c "import sys, importlib.util as u; print(sys.executable); sys.exit(u.find_spec('aee') is not None)"
          if command -v aee; then echo "aee must not be on PATH"; exit 1; fi
          specify --version
      - name: Install AEE with specify from its GitHub archive; dependencies install automatically
        shell: bash
        env:
          AEE_ARCHIVE_URL: https://github.com/${{ github.repository }}/archive/${{ github.event.pull_request.head.sha || github.sha }}.zip
        run: python scripts/check_install.py --from-url "$AEE_ARCHIVE_URL" --clean-interpreter

  # Preserve the existing protected-branch check name while expanding coverage.
  validate:
    if: always()
    needs: [test, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: test "$TEST_RESULT" = success && test "$ACCEPTANCE_RESULT" = success
